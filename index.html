<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONAHIKI MEISTER 完全製品仕様コックピット</title>
    <style>
        body {
            background-color: #e0e0e0;
            color: #333333;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
            user-select: none;
        }

        .container {
            max-width: 550px;
            margin: 30px auto;
            background: #e0e0e0;
            padding: 40px 25px;
            border-radius: 30px;
            box-shadow: -10px -10px 20px #ffffff, 10px 10px 20px #b8b8b8;
            border: none;
        }

        h1 {
            font-size: 32px;
            color: #444444;
            margin: 0 0 5px 0;
            letter-spacing: 3px;
            font-weight: 900;
            text-shadow: 1px 1px 2px #ffffff;
            text-transform: uppercase;
        }

        .sub-title {
            font-size: 16px;
            color: #666666;
            letter-spacing: 4px;
            margin-bottom: 35px;
            opacity: 0.9;
            font-weight: bold;
        }

        .lcd-display {
            background-color: #0b110b;
            border: 6px solid #d0d0d0;
            border-radius: 16px;
            padding: 24px 20px;
            margin-bottom: 40px;
            text-align: left;
            box-shadow: inset 0 0 25px rgba(0,0,0,0.95), 0 8px 20px rgba(0,0,0,0.15);
        }

        .lcd-line {
            font-family: 'Courier New', Courier, monospace;
            font-size: 34px;
            color: #39ff14;
            font-weight: bold;
            min-height: 44px;
            line-height: 44px;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(57,255,20,0.7);
            margin: 8px 0;
            white-space: nowrap;
            overflow: hidden;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        button.meister-3d-btn {
            position: relative;
            background: #e0e0e0;
            color: #444444;
            border: none;
            padding: 26px 10px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: -9px -9px 20px #ffffff, 9px 9px 20px #aaaaaa;
            transition: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        button.meister-3d-btn:active,
        button.meister-3d-btn.pressed {
            box-shadow: inset -6px -6px 15px #ffffff, inset 6px 6px 15px #aaaaaa;
            color: #00b0ff;
            transform: scale(0.97);
        }

        .indicator-sq {
            width: 14px;
            height: 14px;
            background-color: #888888;
            border: 2px solid #ffffff;
            box-shadow: 0 0 5px #888888;
            display: inline-block;
            border-radius: 4px;
        }

        button.meister-3d-btn:active .indicator-sq,
        button.meister-3d-btn.pressed .indicator-sq {
            background-color: #00b0ff;
            box-shadow: 0 0 12px #00b0ff;
        }

        button.connect-btn-style {
            background: #e0e0e0;
            color: #00c853;
            grid-column: span 2;
            padding: 26px 10px;
            font-size: 24px;
            margin-top: 15px;
            border-radius: 50px;
            border: none;
            box-shadow: -9px -9px 20px #ffffff, 9px 9px 20px #aaaaaa;
            font-weight: 900;
            cursor: pointer;
        }

        button.connect-btn-style.connected {
            box-shadow: inset -6px -6px 15px #ffffff, inset 6px 6px 15px #aaaaaa;
            color: #ff1744;
        }

        .indicator-rd {
            width: 16px;
            height: 14px;
            background-color: #00c853;
            border-radius: 50px;
            border: 2px solid #ffffff;
            box-shadow: 0 0 10px #00c853;
            display: inline-block;
        }

        .indicator-rd.connected {
            background-color: #ff1744;
            box-shadow: 0 0 12px #ff1744;
        }

        .status {
            margin-top: 20px;
            font-size: 14px;
            color: #666666;
            min-height: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>KONAHIKI MEISTER</h1>
    <div class="sub-title">CONTROL PANEL</div>

    <div class="lcd-display">
        <div id="lcd-line1" class="lcd-line">DISCONNECTED</div>
        <div id="lcd-line2" class="lcd-line">READY TO CONNECT</div>
    </div>

    <div class="btn-grid">
        <button class="meister-3d-btn control-btn" data-pin="10">
            <span class="indicator-sq"></span> RUN / HOLD
        </button>
        <button class="meister-3d-btn control-btn" data-pin="11">
            <span class="indicator-sq"></span> MENU
        </button>
        <button class="meister-3d-btn control-btn" data-pin="12">
            <span class="indicator-sq"></span> ↑ UP
        </button>
        <button class="meister-3d-btn control-btn" data-pin="13">
            <span class="indicator-sq"></span> ↓ DOWN
        </button>

        <button id="connect-btn" class="connect-btn-style">
            <span id="led-lamp" class="indicator-rd"></span> 本機と通信開始
        </button>
    </div>

    <div id="status" class="status">Bluefyで接続してください</div>
</div>

<script>
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let bleCharacteristic = null;
    let receiveBuffer = new Uint8Array(0);

    const lcdLine1 = document.getElementById('lcd-line1');
    const lcdLine2 = document.getElementById('lcd-line2');
    const connectBtn = document.getElementById('connect-btn');
    const ledLamp = document.getElementById('led-lamp');
    const statusEl = document.getElementById('status');

    function setStatus(text) {
        statusEl.textContent = text;
    }

    function setDisconnectedUI() {
        connectBtn.classList.remove('connected');
        ledLamp.classList.remove('connected');
        connectBtn.innerHTML = '<span id="led-lamp" class="indicator-rd"></span> 本機と通信開始';
        lcdLine1.textContent = 'DISCONNECTED';
        lcdLine2.textContent = 'READY TO CONNECT';
        setStatus('未接続です');
    }

    function setConnectedUI(name) {
        connectBtn.classList.add('connected');
        connectBtn.innerHTML = '<span id="led-lamp" class="indicator-rd connected"></span> 通信切断 停止';
        lcdLine1.textContent = 'CONNECTED';
        lcdLine2.textContent = name || 'READY';
        setStatus('接続しました');
    }

    async function toggleConnection() {
        try {
            if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
                bleDevice.gatt.disconnect();
                return;
            }

            if (!navigator.bluetooth) {
                setStatus('このブラウザではBluetoothが使えません');
                return;
            }

            setStatus('デバイスを検索中です');

            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            bleDevice.addEventListener('gattserverdisconnected', onDisconnected);

            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            await bleCharacteristic.startNotifications();
            bleCharacteristic.addEventListener('characteristicvaluechanged', handleBlynkNotifications);

            setConnectedUI(bleDevice.name || 'BLE DEVICE');
        } catch (error) {
            console.log(error);
            setStatus('接続に失敗しました');
        }
    }

    function onDisconnected() {
        bleCharacteristic = null;
        receiveBuffer = new Uint8Array(0);
        setDisconnectedUI();
    }

    function handleBlynkNotifications(event) {
        const value = new Uint8Array(event.target.value.buffer);
        const temp = new Uint8Array(receiveBuffer.length + value.length);
        temp.set(receiveBuffer, 0);
        temp.set(value, receiveBuffer.length);
        receiveBuffer = temp;

        while (receiveBuffer.length >= 5) {
            const cmd = receiveBuffer[0];
            const len = (receiveBuffer[3] << 8) | receiveBuffer[4];

            if (receiveBuffer.length < 5 + len) {
                break;
            }

            const body = receiveBuffer.slice(5, 5 + len);
            receiveBuffer = receiveBuffer.slice(5 + len);

            if (cmd === 20) {
                const bodyText = new TextDecoder('utf-8').decode(body);
                const parts = bodyText.split('\0');

                if (parts.length >= 3 && parts[0] === 'vw') {
                    const pin = parseInt(parts[1], 10);
                    const val = parts[2];

                    if (pin === 4) {
                        lcdLine1.textContent = val || '';
                    } else if (pin === 0) {
                        lcdLine2.textContent = val || '';
                    }
                }
            }
        }
    }

    async function sendBlynkButton(pin, state) {
        if (!bleCharacteristic) {
            setStatus('先に接続してください');
            return;
        }

        try {
            const bodyText = `vw\0${pin}\0${state}`;
            const body = new TextEncoder().encode(bodyText);
            const len = body.length;
            const packet = new Uint8Array(5 + len);

            packet[0] = 20;
            packet[1] = 0;
            packet[2] = 1;
            packet[3] = (len >> 8) & 0xFF;
            packet[4] = len & 0xFF;
            packet.set(body, 5);

            await bleCharacteristic.writeValue(packet);
        } catch (error) {
            console.log(error);
            setStatus('送信に失敗しました');
        }
    }

    function bindMomentaryButton(button) {
        const pin = parseInt(button.dataset.pin, 10);

        const press = async (event) => {
            event.preventDefault();
            button.classList.add('pressed');
            await sendBlynkButton(pin, 1);
        };

        const release = async (event) => {
            event.preventDefault();
            button.classList.remove('pressed');
            await sendBlynkButton(pin, 0);
        };

        button.addEventListener('touchstart', press, { passive: false });
        button.addEventListener('touchend', release, { passive: false });
        button.addEventListener('touchcancel', release, { passive: false });
        button.addEventListener('mousedown', press);
        button.addEventListener('mouseup', release);
        button.addEventListener('mouseleave', () => {
            button.classList.remove('pressed');
        });
    }

    document.querySelectorAll('.control-btn').forEach(bindMomentaryButton);
    connectBtn.addEventListener('click', toggleConnection);

    setDisconnectedUI();
</script>
</body>
</html>
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KONAHIKI MEISTER</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }

    .lcd {
      width: 320px;
      margin: 0 auto 20px;
      padding: 16px;
      background: #203020;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .lcd-line {
      height: 32px;
      line-height: 32px;
      font-size: 24px;
      color: #7CFC00;
      background: #102010;
      margin: 6px 0;
      border-radius: 4px;
      font-family: monospace;
      letter-spacing: 1px;
      overflow: hidden;
      white-space: pre;
    }

    button {
      font-size: 18px;
      padding: 12px 20px;
      margin: 8px;
      border: none;
      border-radius: 8px;
      background: #007aff;
      color: white;
    }

    #status {
      margin: 12px 0 20px;
      color: #333;
    }
  </style>
</head>
<body>
  <h1>KONAHIKI MEISTER</h1>

  <div class="lcd">
    <div id="lcd1" class="lcd-line">                </div>
    <div id="lcd2" class="lcd-line">                </div>
  </div>

  <div id="status">未接続</div>

  <button onclick="connectBLE()">接続</button>

  <script>
    let bleCharacteristic;

    async function connectBLE() {
      try {
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'KONAHIKI_MEISTER_BLE' }],
          optionalServices: ['0000ffe0-0000-1000-8000-00805f9b34fb']
        });

        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('0000ffe0-0000-1000-8000-00805f9b34fb');
        bleCharacteristic = await service.getCharacteristic('0000ffe1-0000-1000-8000-00805f9b34fb');

        await bleCharacteristic.startNotifications();
        bleCharacteristic.addEventListener('characteristicvaluechanged', handleNotify);

        document.getElementById('status').textContent = '接続済み';
      } catch (e) {
        document.getElementById('status').textContent = '接続失敗';
        console.log(e);
      }
    }

    function handleNotify(event) {
      const value = new TextDecoder().decode(event.target.value);
      const parts = value.split('\n');

      document.getElementById('lcd1').textContent = (parts[0] || '').padEnd(16, ' ').slice(0, 16);
      document.getElementById('lcd2').textContent = (parts[1] || '').padEnd(16, ' ').slice(0, 16);
    }
  </script>
</body>
</html>
