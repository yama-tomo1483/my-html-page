<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KONAHIKI MEISTER 完全製品仕様コックピット</title>
    <style>
        /* 大将特注：あの美しい見本（image_ZhxNsp.png）を100%引き摺り下ろした、大安心のライトホワイトグレー背景 */
        body { background-color: #e0e0e0; color: #333333; font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; margin: 0; user-select: none; }
        
        /* コックピット外枠も、大安心の美しい立体お椀型３Ｄで統一新築 */
        .container { max-width: 550px; margin: 30px auto; background: #e0e0e0; padding: 40px 25px; border-radius: 30px; box-shadow: -10px -10px 20px #ffffff, 10px 10px 20px #b8b8b8; border: none; }
        
        /* 大棟梁特注：大正義の純白高級製品名札ロゴプレート */
        h1 { font-size: 32px; color: #444444; margin: 0 0 5px 0; letter-spacing: 3px; font-weight: 900; text-shadow: 1px 1px 2px #ffffff; text-transform: uppercase; }
        .sub-title { font-size: 16px; color: #666666; letter-spacing: 4px; margin-bottom: 35px; opacity: 0.9; font-weight: bold; }
        
        /* 表示を限界突破で大きくした大安心２行液晶ディスプレイベッド */
        .lcd-display { background-color: #0b110b; border: 6px solid #d0d0d0; border-radius: 16px; padding: 24px 20px; margin-bottom: 40px; text-align: left; box-shadow: inset 0 0 25px rgba(0,0,0,0.95), 0 8px 20px rgba(0,0,0,0.15); }
        .lcd-line { font-family: 'Courier New', Courier, monospace; font-size: 34px; color: #39ff14; font-weight: bold; height: 44px; line-height: 44px; letter-spacing: 1.5px; text-shadow: 0 0 15px rgba(57,255,20,0.7); margin: 8px 0; white-space: nowrap; overflow: hidden; }
        
        .btn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 30px; }
        
        /* 🛠️ 大将完全特注：image_ZhxNsp.pngを100%等倍完全ハンダ付け再現！！！太陽マークを完全全滅抹殺した、あのしっとり凹むお椀型立体3Dモーメンタリーボタン法律！！！ */
        button.meister-3d-btn {
            position: relative;
            background: #e0e0e0;
            color: #444444; /* 高級オーディオ風の渋い漆黒グレー文字 */
            border: none;
            padding: 26px 10px;
            font-size: 22px;
            font-weight: 900;
            border-radius: 50px; /* 見本（image_ZhxNsp.png）と1ミリの狂いもない美しい丸型お椀エッジ */
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            /* これだァァァッ！！！見本（image_ZhxNsp.png）から一撃で引き摺り下ろした白光と影の立体ニューモフィズム3Dグラデーション影！！！ */
            box-shadow: -9px -9px 20px #ffffff, 
                        9px 9px 20px #aaaaaa;
            transition: none; /* モーメンタリー直撃のためブレを完全全カット */
            -webkit-tap-highlight-color: transparent;
        }
        
        /* 🥷 大将完全特注：指で押したコンマ0秒の瞬間、見本（image_ZhxNsp.png）のように「スンッ...」と内側へ等倍凹む本物のモーメンタリー電気改札口！ */
        button.meister-3d-btn:active {
            box-shadow: inset -6px -6px 15px #ffffff, 
                        inset 6px 6px 15px #aaaaaa;
            color: #00b0ff; /* 押し込んだ瞬間に通電を実況するネオンブルー大覚醒演出法律！！！ */
            transform: scale(0.97);
        }
        
        /* ボタンの中の小さな実機風スクエアLEDランプ */
        .indicator-sq { 
            width: 14px; 
            height: 14px; 
            background-color: #888888; 
            border: 2px solid #ffffff; 
            box-shadow: 0 0 5px #888888; 
            display: inline-block; 
            border-radius: 4px;
        }
        button.meister-3d-btn:active .indicator-sq {
            background-color: #00b0ff;
            box-shadow: 0 0 12px #00b0ff;
        }
        
        /* 大将特注：最下段をビシッと占領する巨大『 本機と通信開始 』大安心3Dグリーン放電ボタン */
        button.connect-btn-style { 
            background: #e0e0e0; 
            color: #00c853; /* 大大正義の高級グリーン文字パルス */
            grid-column: span 2; 
            padding: 26px 10px; 
            font-size: 24px; 
            margin-top: 15px; 
            border-radius: 50px;
            box-shadow: -9px -9px 20px #ffffff, 
                        9px 9px 20px #aaaaaa;
            font-weight: 900;
        }
        button.connect-btn-style:active {
            box-shadow: inset -6px -6px 15px #ffffff, 
                        inset 6px 6px 15px #aaaaaa;
            color: #39ff14;
            transform: scale(0.97);
        }
        
        /* 本機と通信ボタンの中の丸型LEDランプ */
        .indicator-rd { width: 16px; height: 14px; background-color: #00c853; border-radius: 50px; border: 2px solid #ffffff; box-shadow: 0 0 10px #00c853; display: inline-block; }
        button.connect-btn-style:active .indicator-rd {
            background-color: #39ff14;
            box-shadow: 0 0 15px #39ff14;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- 純白超巨大ロゴプレート -->
    <h1>KONAHIKI MEISTER</h1>
    <div class="sub-title">CONTROL PANEL</div>
    
    <!-- 大将の魂の超巨大化・２行液晶ベッド（V4部屋 ＆ V0部屋） -->
    <div class="lcd-display">
        <div id="lcd-line1" class="lcd-line">DISCONNECTED</div>
        <div id="lcd-line2" class="lcd-line">READY TO CONNECT</div>
    </div>
    
    <!-- 大将の魂の４連・本物お椀型立体３Ｄモーメンタリーボタン（※太陽マークは跡形もなく完全抹殺全カット完了！） -->
    <div class="btn-grid">
        <button class="meister-3d-btn" onmousedown="sendBlynkButton(10, 1)" onmouseup="sendBlynkButton(10, 0)" ontouchstart="sendBlynkButton(10, 1)" ontouchend="sendBlynkButton(10, 0)"><span class="indicator-sq"></span> RUN / HOLD</button>
        <button class="meister-3d-btn" onmousedown="sendBlynkButton(11, 1)" onmouseup="sendBlynkButton(11, 0)" ontouchstart="sendBlynkButton(11, 1)" ontouchend="sendBlynkButton(11, 0)"><span class="indicator-sq"></span> MENU</button>
        <button class="meister-3d-btn" onmousedown="sendBlynkButton(12, 1)" onmouseup="sendBlynkButton(12, 0)" ontouchstart="sendBlynkButton(12, 1)" ontouchend="sendBlynkButton(12, 0)"><span class="indicator-sq"></span> ↑ UP</button>
        <button class="meister-3d-btn" onmousedown="sendBlynkButton(13, 1)" onmouseup="sendBlynkButton(13, 0)" ontouchstart="sendBlynkButton(13, 1)" ontouchend="sendBlynkButton(13, 0)"><span class="indicator-sq"></span> ↓ DOWN</button>
        
        <button id="connect-btn" class="connect-btn-style" onclick="toggleConnection()"><span id="led-lamp" class="indicator-rd"></span> 本機と通信開始</button>
    </div>
</div>

<script>
    // 世界公式 FFE0 ＆ FFE1 黄金改札口の暗号配線
    const SERVICE_UUID = '0000ffe0-0000-1000-8000-00805f9b34fb';
    const CHARACTERISTIC_UUID = '0000ffe1-0000-1000-8000-00805f9b34fb';

    let bleDevice = null;
    let bleCharacteristic = null;
    let receiveBuffer = new Uint8Array(0);

    async function toggleConnection() {
        const btn = document.getElementById('connect-btn');
        if (bleDevice && bleDevice.gatt.connected) {
            await bleDevice.gatt.disconnect();
            return;
        }

        try {
            bleDevice = await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [SERVICE_UUID]
            });

            bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
            const server = await bleDevice.gatt.connect();
            const service = await server.getPrimaryService(SERVICE_UUID);
            bleCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

            await bleCharacteristic.startNotifications();
            bleCharacteristic.addEventListener('characteristicvaluechanged', handleBlynkNotifications);

            btn.style.boxShadow = "inset -6px -6px 15px #ffffff, inset 6px 6px 15px #aaaaaa";
            btn.style.color = "#ff1744";
            btn.innerHTML = '<span id="led-lamp" class="indicator-rd" style="background-color:#ff1744; box-shadow:0 0 12px #ff1744; border:2px solid #ffffff;"></span> 通信切断（停止）';
            document.getElementById('lcd-line1').innerText = "READY FOR MILL";
            document.getElementById('lcd-line2').innerText = "MILL SPEED : 5";
        } catch (error) {
            console.log(error);
        }
    }

    function onDisconnected() {
        const btn = document.getElementById('connect-btn');
        btn.style.boxShadow = "-9px -9px 20px #ffffff, 9px 9px 20px #aaaaaa";
        btn.style.color = "#00c853";
        btn.innerHTML = '<span id="led-lamp" class="indicator-rd" style="background-color:#00c853; box-shadow:0 0 10px #00c853; border:2px solid #ffffff;"></span> 本機と通信開始';
        document.getElementById('lcd-line1').innerText = "DISCONNECTED";
        document.getElementById('lcd-line2').innerText = "READY TO CONNECT";
    }

    function handleBlynkNotifications(event) {
        let value = event.target.value;
        let newData = new Uint8Array(value.buffer);
        
        let temp = new Uint8Array(receiveBuffer.length + newData.length);
        temp.set(receiveBuffer);
        temp.set(newData, receiveBuffer.length);
        receiveBuffer = temp;

        while (receiveBuffer.length >= 5) {
            let cmd = receiveBuffer;
            let len = (receiveBuffer << 8) | receiveBuffer;

            if (receiveBuffer.length < 5 + len) break;

            let body = receiveBuffer.subarray(5, 5 + len);
            receiveBuffer = receiveBuffer.subarray(5 + len);

            if (cmd === 20) { 
                let decoder = new TextDecoder('utf-8');
                let bodyText = decoder.decode(body);
                let parts = bodyText.split('\0');
                if (parts.length >= 3 && parts === 'vw') {
                    let pin = parseInt(parts);
                    let val = parts;
                    
                    if (pin === 4) { 
                        document.getElementById('lcd-line1').innerText = val;
                    } else if (pin === 0) { 
                        document.getElementById('lcd-line2').innerText = val;
                    }
                }
            }
        }
    }

    async function sendBlynkButton(pin, state) {
        if (!bleCharacteristic) return;
        try {let encoder = new TextEncoder('utf-8');
let bodyText = "vw\0" + pin + "\0" + state;
let body = encoder.encode(bodyText);
let len = body.length;
let packet = new Uint8Array(5 + len);
packet = 20;
packet = 0;
packet = 1;
packet = (len >> 8) & 0xFF;
packet = len & 0xFF;
packet.set(body, 5);
await bleCharacteristic.writeValue(packet);
} catch (error) {
console.log("送信エラー:", error);
}
}
